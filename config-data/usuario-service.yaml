server:
  port: ${PORT:${SERVER_PORT:0}}

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      default-zone: http://localhost:8761/eureka

  instance:
    #prefer-ip-address: true  # Asegura que use la IP
    #instance-id: ${spring.cloud.client.ip-address}:${server.port}  # Instancia basada en IP
    instance-id: ${spring.application.name}:${random.uuid}

logging:
  level:
    root: debug
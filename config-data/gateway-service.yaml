server:
  port: 8080
eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      default-zone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true  # <-- Esto hará que use la IP en lugar del hostname
    instance-id: ${spring.cloud.client.ip-address}:${server.port}
    #hostname: localhost

spring: 
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: usuario-service
          uri: lb://USUARIO-SERVICE
          predicates:
            - Path=/usuario/**
        - id: carro-service
          uri: lb://CARRO-SERVICE
          predicates:
            - Path=/api/v1/carro/**
        - id: moto-service
          uri: lb://MOTO-SERVICE
          predicates:
            - Path=/api/v1/moto/**

